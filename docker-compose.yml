services:
  server:
    build: ./server
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - monitor-data:/app/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  monitor-data:
  redis-data:
